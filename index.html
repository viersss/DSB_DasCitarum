<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Kerentanan Erosi DAS Citarum</title>
    <meta name="description" content="Visualisasi spasial kerentanan erosi Sub-DAS Citarum berbasis Compound Parameter dan algoritma Machine Learning.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <div class="logo-mark">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12h4l3-9 5 18 3-9h5"/>
                    </svg>
                </div>
                <h2>Peta Kerentanan Erosi DAS Citarum</h2>
            </div>
            <div class="topbar-badge">Visualisasi Spasial & Machine Learning</div>
        </header>

        <!-- Main Explorer -->
        <section class="explorer-section">
            <div class="controls-container">
                <div class="control-group">
                    <label for="modelSelect">Pilih Model Prediksi:</label>
                    <select id="modelSelect" class="custom-select">
                        <option value="Actual_Class">Target Aktual (Compound Parameter)</option>
                        <option value="Random Forest" selected>Random Forest</option>
                        <option value="XGBoost">XGBoost</option>
                        <option value="Decision Tree">Decision Tree</option>
                        <option value="SVM (Polynomial)">SVM (Polynomial)</option>
                        <option value="KNN">KNN</option>
                    </select>
                </div>
                
                <div class="legend-bar">
                    <span class="legend-chip high">Tinggi</span>
                    <span class="legend-chip medium">Sedang</span>
                    <span class="legend-chip low">Rendah</span>
                </div>
            </div>

            <div class="explorer-layout">
                <div class="map-container">
                    <div id="map"></div>
                </div>
                
                <aside class="side-panel">
                    <div class="panel-card">
                        <div class="panel-header">
                            <h4>Feature Importance</h4>
                            <p class="panel-desc" id="fiSubtitle">Top 5 parameter berpengaruh</p>
                        </div>
                        <div class="chart-wrapper">
                            <canvas id="importanceChart" height="190"></canvas>
                        </div>
                    </div>
                    
                    <div class="panel-card flex-fill">
                        <div class="panel-header">
                            <h4>Detail Wilayah</h4>
                        </div>
                        <div id="detailSubdas" class="detail-content">
                            <div class="empty-state">
                                Klik salah satu Sub-DAS pada peta untuk melihat detail prediksinya.
                            </div>
                        </div>
                    </div>
                </aside>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
